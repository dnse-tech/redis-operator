name: Release Charts

# chart-releaser only publishes when a chart's version changes, so limit the
# trigger to chart sources instead of running it on every push to master.
on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.7.2

      - name: Release
        uses: helm/chart-releaser-action@v1.5.0
        with:
          charts_dir: charts
          config: charts/chart-release-config.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
