name: CI

# Scoped to changes that can affect the Go build/test result. Chart-only or
# docs-only changes are covered by chart-ci.yaml / nothing, so they no longer
# spend ~7 minutes on the integration matrix. GitHub Actions does not support
# YAML anchors, so the path list is repeated for push and pull_request.
on:
  push:
    branches:
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - 'manifests/**'
      - 'charts/redisoperator/crds/**'
      - 'mocks/**'
      - 'test/**'
      - 'docker/**'
      - 'scripts/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - 'manifests/**'
      - 'charts/redisoperator/crds/**'
      - 'mocks/**'
      - 'test/**'
      - 'docker/**'
      - 'scripts/**'
      - '.github/workflows/ci.yaml'

# Least-privilege default: jobs only read repo contents. Elevate per-job if needed.
permissions:
  contents: read

jobs:
  check:
    name: Golang Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        # v9 is the first Node-24 major (v7/v8 are still Node 20); it runs golangci-lint v2.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.0

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make ci-unit-test

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [check, unit-test]
    strategy:
      matrix:
        # minikube v1.38.1 supports k8s 1.28-1.35; client-go v0.34 covers this
        # band within the +/-1 skew. Newest (1.35.1) is minikube's default.
        kubernetes: [1.33.13, 1.34.10, 1.35.1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # driver=none runs the kubelet on the host and needs conntrack. The
      # integration test talks to redis at 127.0.0.1, which relies on this
      # host-networked driver. The container runtime is docker via cri-dockerd
      # (installed by setup-minikube) — the runner's Docker is fully working,
      # whereas its pre-installed containerd ships with the CRI plugin disabled.
      - name: Install conntrack
        run: sudo apt-get update && sudo apt-get install -y conntrack
      - uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
        with:
          kubernetes-version: ${{ matrix.kubernetes }}
          minikube-version: 1.38.1
          driver: none
          container-runtime: docker
      - name: Add redisfailover CRD
        run: kubectl create -f manifests/databases.spotahome.com_redisfailovers.yaml
      - run: make ci-integration-test

  verify-generated:
    name: Verify generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Both targets run the pinned codegen image in docker, so no local Go
      # toolchain is needed here. The image runs as its own uid 1000 user and
      # cannot write into the runner's workspace, so it runs as root and the
      # output is handed back to the runner afterwards.
      - name: Regenerate client, deepcopy and CRD
        run: |
          make update-codegen CODEGEN_DOCKER_FLAGS="--user 0:0"
          make generate-crd CODEGEN_DOCKER_FLAGS="--user 0:0"
          sudo chown -R "$(id -u):$(id -g)" client/k8s manifests charts/redisoperator/crds api
      - name: Fail if the committed output is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'make update-codegen' and 'make generate-crd', then commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "Generated files are up to date."

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        run: govulncheck ./...
