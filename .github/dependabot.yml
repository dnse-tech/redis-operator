version: 2
updates:
  # Go modules. k8s.io/* is intentionally ignored so the client-go minor stays
  # under manual control — it must track the integration test band within
  # Kubernetes' +/-1 client/server skew, which an automatic bump would break.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
    ignore:
      - dependency-name: "k8s.io/*"

  # Keep the SHA-pinned GitHub Actions current (they carry `# vX.Y.Z` comments
  # so Dependabot can resolve and bump them).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
